name: Render Keep Alive

on:
  schedule:
    - cron: '*/10 8-19 * * 1-6'
      timezone: Asia/Kolkata
    - cron: '0 20 * * 1-6'
      timezone: Asia/Kolkata
    - cron: '*/10 8-13 * * 0'
      timezone: Asia/Kolkata
    - cron: '0 14 * * 0'
      timezone: Asia/Kolkata
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Render health endpoint
        shell: bash
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set +x

          echo "======================================"
          echo "Render Keep Alive - Debug"
          echo "Current UTC time: $(date -u)"
          echo "Current IST time: $(TZ=Asia/Kolkata date)"
          echo "Sending health check..."
          echo "======================================"

          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "ERROR: RENDER_HEALTH_URL secret is missing or empty."
            exit 1
          fi

          START_TIME=$(date +%s)

          if HTTP_CODE=$(curl -sS -L \
            --connect-timeout 30 \
            --max-time 120 \
            -o /dev/null \
            -w "%{http_code}" \
            "$RENDER_HEALTH_URL"); then

            END_TIME=$(date +%s)
            ELAPSED=$((END_TIME - START_TIME))

            echo "HTTP status: $HTTP_CODE"
            echo "Response time: ${ELAPSED} seconds"

            if [ "$HTTP_CODE" -ge 200 ] &&
               [ "$HTTP_CODE" -lt 300 ]; then
              echo "RESULT: SUCCESS - Render responded successfully."
            else
              echo "RESULT: WARNING - Render returned a non-2xx status."
            fi
          else
            CURL_EXIT=$?
            END_TIME=$(date +%s)
            ELAPSED=$((END_TIME - START_TIME))

            echo "RESULT: FAILED - Health check request failed."
            echo "curl exit code: $CURL_EXIT"
            echo "Elapsed time: ${ELAPSED} seconds"
            exit "$CURL_EXIT"
          fi

          echo "Health check finished."
